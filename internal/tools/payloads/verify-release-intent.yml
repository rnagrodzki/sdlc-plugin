# verify-release-intent-version: 2
name: Verify Release Intent

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, edited]

jobs:
  verify:
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Verify release intent
        run: node .github/scripts/verify-release-intent.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
