# ─── SDLC Local Configuration ────────────────────────────────────
# Personal preferences — gitignored, not shared with the team.
# Edit this file directly, then run the validate tool to check.

# ─── Ship pipeline ───────────────────────────────────────────────

[ship]
# Auto-run full pipeline without confirmation prompts.
auto = true

# Default version bump.
# Valid: "major" | "minor" | "patch", or a pre-release label such as "rc", "beta", "alpha"
bump = "patch"

# Create PR as draft.
draft = false

# Rebase onto default branch before shipping.
# Valid: true | false | "prompt"
rebase = true

# Minimum severity that triggers the review fix loop (lower findings are deferred, not dropped).
# Valid: "info" | "low" | "medium" | "high" | "critical"
# Default "info" sends every finding into the fix loop; "low" defers Info findings.
reviewThreshold = "info"

# Pipeline steps to execute during /ship (in order).
# Valid steps: "execute" | "commit" | "review" | "harden" | "verify-openspec" |
#   "archive-openspec" | "pr" | "verify-pipeline" |
#   "await-remote-review" | "learnings-commit"
steps = ["execute", "commit", "review", "harden", "pr", "verify-pipeline"]

# Quick mode steps (subset of steps, for /ship --quick).
quick = ["execute", "commit", "review"]

# ─── Polling intervals (seconds) ─────────────────────────────────

# Execute wave polling.
executeWaveInterval = 60
executeWaveTimeout = 1800

# CI/CD pipeline verification polling.
verifyPipelineInterval = 60
verifyPipelineMaxIterations = 3
verifyPipelineTimeout = 1200

# Remote review (e.g. GitHub Copilot) polling.
awaitRemoteReviewers = ["copilot"]
awaitRemoteReviewInterval = 60
awaitRemoteReviewTimeout = 600

# ─── Communication style (every sdlc skill) ─────────────────────

[style]
# audience = "functional"      # technical | functional | executive | general | beginner
# writingStandard = "plain-language"  # ste | plain-language | developer-docs | smart-brevity
# tone = "direct"              # direct | neutral
# language = "English"
# technicalTerms = []          # words the strict STE checks accept

# ─── Plan-only style ─────────────────────────────────────────────

[planStyle]
# visualDensity = "balanced"   # high | balanced | low
# narrativeRules = []
# instructions = []
# Deprecated — moved to [style]; still accepted here so old files validate.
# audience = "functional"      # technical | functional | executive | general | beginner
# writingStandard = "plain-language"  # ste | plain-language | developer-docs | smart-brevity
# tone = "direct"              # direct | neutral
# language = "English"
# technicalTerms = []          # words the strict STE checks accept
# Deprecated — no longer used; ignored with a warning. Set visualDensity above instead.
# verbosity = "standard"       # terse | standard | detailed

# ─── Review defaults (optional — delete if not using) ─────────────
# [review]
# Which changes to include in the review.
# Valid: "all" | "committed" | "staged" | "working" | "worktree"
# scope = "working"

# ─── Received-review defaults (optional — delete if not using) ────
# [receivedReview]
# Severities whose 'will fix' findings bypass the per-finding consent gate.
# Local-only — must NEVER be set in .sdlc-v2/config.toml.
# Valid items: "low" | "medium" | "high" | "critical"
# alwaysFixSeverities = []

# ─── Automation (optional — delete if not using) ──────────────────

# [automation]
# # Valid: "supervised" | "unattended"
# mode = "supervised"
# reviewFixIterations = 3
# reviewFixSeverityThreshold = "high"
#
# # Per-step overrides. Valid values: "auto" | "confirm"
# [automation.steps]
# execute = "confirm"
# review = "auto"
#
# # Rate-based thresholds for halting an unattended run on plan drift.
# [automation.drift]
# maxErrorRate = 0.15
# maxWarningRate = 0.4
# minErrorFloor = 2
#
# # Execution report emitted at the end of a run.
# [automation.report]
# enabled = true
# format = "md"
#
# # Feature-branch push during ship skips the manual confirmation pause.
# [automation.push]
# featureBranchAutoApprove = false

# ─── GitHub account ─────────────────────────────────────────────
# [github]
# GitHub login expected to be active when /pr creates a PR. /pr halts if
# the active gh account differs. Leave unset to use the origin owner.
# expectedAccount = "my-gh-login"

# ─── Execute preferences ────────────────────────────────────────
# [executePrefs]
# Run unattended: no prompts, auto-create a feature branch when starting
# on the default branch, auto-approve high-risk waves. Error-severity
# guardrail violations still halt execution.
# auto = false

# Skip the quality-tier prompt by fixing the model preset.
# Valid: "full" | "balanced" | "minimal"
#   full      -- Speed: lightest models, skips the spec compliance review
#   balanced  -- Balanced: the interactive default
#   minimal   -- Quality: strongest models, max correctness
# Commented out on purpose: the tier prompt doubles as the execution-plan
# approval gate, so uncommenting this removes that confirmation step.
# quality = "balanced"

# Auto-approve waves containing a High-risk task, because the plan was
# already approved at plan time.
# highRiskAutoApprove = false

# ─── Workspace (optional — delete if not using) ────────────────────
# Branch-name derivation knobs consumed by lib/branch-name.js.
# [workspace.branch]
# Branch name template. Placeholders: {type}, {slug}, {issue}, {date}.
# template = "{type}/{slug}"
# Maximum length of the slug segment before substitution into the template.
# slugMaxLength = 50
# Maps logical plan type to branch prefix.
# typeMap = { feature = "feat", bugfix = "fix", chore = "chore", docs = "docs", refactor = "refactor" }
