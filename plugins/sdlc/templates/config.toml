# ─── SDLC Project Configuration (v1) ─────────────────────────────
# Shared across the team — committed to version control.
# Edit this file directly, then run the validate tool to check.
# Delete sections you don't use.

# ─── Versioning ───────────────────────────────────────────────────

[version]
# Current pre-release tag (free-form string, e.g. "rc", "beta", "alpha")
preRelease = "rc"

# When to apply pre-release tags.
# Valid: "always-rc" | "default-rc" | "continue-rc" | "never"
#   always-rc    — every release gets an rc tag
#   default-rc   — rc by default, but explicit CLI --bump overrides to final
#   continue-rc  — only if already in rc
#   never        — skip pre-release, go straight to release
preReleasePolicy = "always-rc"

# How versions reach the remote.
# Valid: "push" | "pr" | "push-with-secret"
#   push             — direct push to default branch
#   pr               — create a pull request
#   push-with-secret — deprecated alias for "push"; the release scripts
#                      normalize it to "push" before running
method = "push"

# Optional, for any method above (not only push-with-secret): a custom
# push-auth secret. Uncomment and set secretName to a repo secret holding a
# GitHub App-issued token (or PAT) with Contents, Pull requests and Actions
# read/write permissions and bypass privileges on branch-protection
# rulesets — scaffold_ci then rewrites the scaffolded workflows to
# authenticate with it instead of the default RELEASE_TOKEN fallback.
# Default when unset: RELEASE_TOKEN.
# [version.pushAuth]
# secretName = "RELEASE_TOKEN"

[version.tag]
# Create git tags for releases.
enabled = true
# Tag prefix (e.g. "v" → "v1.2.3", "" → "1.2.3")
prefix = "v"

# In [version.versionFile] below, path = "" and fileType = "" are placeholders.
# fileType = "" is not a valid value. Set both, or set enabled = false.

[version.versionFile]
# Write version number to a file on release.
enabled = true
# Path relative to repo root.
path = ""
# Valid: "package.json" | "plugin.json" | "version-file" | "pyproject.toml" |
#        "cargo.toml" | "pubspec.yaml"
fileType = ""

[version.changelog]
# Auto-generate changelog from conventional commits.
enabled = true
# Changelog file path relative to repo root.
file = "CHANGELOG.md"

# ─── Jira integration (optional — delete this section if not using Jira) ──────
# The empty defaultProject value below is a placeholder, not a valid key.
# Set a key, or delete this section.

[jira]
# Default Jira project key (2–10 uppercase letters, e.g. "PROJ").
defaultProject = ""
# Allowed Jira project keys when the repo maps to multiple projects.
# Uncomment and list at least 2 keys to enable closed-list prompting.
# projects = ["PROJ", "OPS"]

# ─── Commit conventions ──────────────────────────────────────────

[commit]
# Allowed commit types (conventional-commit prefix before the colon).
allowedTypes = ["feat", "fix", "chore", "docs", "refactor", "test", "ci", "perf"]
# Allowed scopes (empty = any scope accepted).
allowedScopes = []
# Regex pattern the commit subject line must match.
# subjectPattern = "^(feat|fix)(\\(.+\\))?: .+"
# Human-readable error message when subject pattern fails.
# subjectPatternError = "Use <type>(<scope>): <subject>"
# Commit types that require a body message.
# requireBodyFor = ["feat"]
# Required trailer keys in commit message.
# requiredTrailers = ["Refs"]

# ─── Pull request defaults ───────────────────────────────────────

[pr]
# Regex pattern the PR title must match.
# titlePattern = "^(feat|fix|chore|docs|refactor|test|ci|perf)(\\(.+\\))?: .+"
# Human-readable error message when title pattern fails.
# titlePatternError = "Use <type>(<scope>): <subject>"
# Allowed PR title type prefixes.
# allowedTypes = ["feat", "fix", "chore", "docs", "refactor", "test", "ci", "perf"]
# Allowed PR title scopes.
# allowedScopes = []

# Label assignment mode for PRs created by /ship.
# Valid: "off" (default, no automatic labels) | "rules" | "llm"
# [pr.labels]
# mode = "off"
# Label rules evaluated when mode = "rules". Each rule names one label and one signal.
# rules = [{ label = "breaking", when = { commitType = ["feat!"] } }]

# ─── Git ──────────────────────────────────────────────────────────

[git]
# Integration branch for execute, ship, pr, review, commit.
# Empty = use the repository's default branch.
baseBranch = ""

# ─── Plan guardrails ─────────────────────────────────────────────
# Constraints enforced during plan creation.
# ID is the table key — TOML enforces uniqueness, no duplicates possible.
# severity: "error" (blocking, plan fails) or "warning" (advisory, shown but not blocking).
#
# Add your own guardrails as new [plan.guardrails.<your-id>] tables.
# Example:
#
# [plan.guardrails.my-custom-rule]
# severity = "warning"
# description = "Explain what this guardrail enforces."

[plan.guardrails.test-coverage-required]
severity = "error"
description = """
Every task that creates or modifies source code \
must include corresponding test cases."""

[plan.guardrails.no-ci-bypass]
severity = "error"
description = "Plans must not include steps that skip or disable CI checks."

# Team contract for plan tasks and deliverables (optional).
# [plan.tasks]
# Required fields for each task in a plan.
# requiredFields = ["Owner", "Rollback"]
# Shape of the task contract: full (complete), minimal (essential), or none (flexible).
# contractShape = "full"

# ─── Execute behavior ───────────────────────────────────────────
# Runtime behavior for /execute.
# Personal preferences (auto, quality, highRiskAutoApprove) live in
# .sdlc-v2/local.toml under [executePrefs].

[execute]
# Merge origin/<base> into the branch between execute waves.
baseSync = true
# Whether execute_state's wave-commit action stages and commits each
# completed wave's changes itself (git add -A + git commit). When false,
# commit the wave manually and record the sha via wave-committed.
# commitWaves = true

# ─── Execute guardrails ──────────────────────────────────────────
# Constraints enforced during task execution.
# Same format as plan guardrails.

[execute.guardrails.independent-completion-reverification]
severity = "error"
description = """
Never record task-done from a self-report alone. \
Always independently confirm via git diff and re-run \
of build/vet/test commands."""

# ─── Harden instructions ─────────────────────────────────────────
# Custom instructions for the harden skill. Each item guides how harden
# drafts its proposals for one surface. An item never relaxes or removes a rule.
# One list for each proposal surface. The four lists are independent.
# Harden trims each item and ignores an item that is blank after the trim.

[harden.instructions]
# Guides how harden drafts plan guardrail proposals. Max 10 items, 1-1024 characters each (no empty strings).
# Example: plan-guardrails = ["Prefer error severity for CI rules."]
plan-guardrails = []
# Guides how harden drafts execute guardrail proposals. Max 10 items, 1-1024 characters each (no empty strings).
# Example: execute-guardrails = ["Re-run the full test suite after every wave."]
execute-guardrails = []
# Guides how harden drafts review dimension proposals. Max 10 items, 1-1024 characters each (no empty strings).
# Example: review-dimensions = ["Check that every new endpoint has an auth test."]
review-dimensions = []
# Guides how harden drafts copilot instruction proposals. Max 10 items, 1-1024 characters each (no empty strings).
# Example: copilot-instructions = ["Use table-driven tests for Go code."]
copilot-instructions = []
