name: Test

# These two commands (vet, test) are mirrored in lefthook.yml's pre-push hook —
# keep them in sync so local and CI never diverge on what green means.
# The Node "Test release scripts" step is intentionally CI-only: lefthook
# does not run it, so run it by hand when touching .github/scripts/.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tests that run the real openspec CLI (e.g. TestStage_RealCLIOmittedScenario)
      # skip when it is not on PATH. Pin the version so a CLI release cannot
      # change test results without a commit here.
      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.1

      - name: Test
        run: go test -tags integration ./...

      - name: Test release scripts
        run: node --test .github/scripts/__tests__/*.test.cjs internal/dashboard/web/testdata/view.test.cjs
