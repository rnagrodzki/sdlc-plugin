name: Test

# These two commands (vet, test) are mirrored in lefthook.yml's pre-push hook —
# keep them in sync so local and CI never diverge on what green means.

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -tags integration ./...
