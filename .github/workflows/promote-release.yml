# promote-release-version: 7
name: SDLC Promote Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Bump level for the promoted release (auto-calculates version from latest stable tag)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote RC to final release
        run: node .github/scripts/promote-release.cjs ${{ inputs.level }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
