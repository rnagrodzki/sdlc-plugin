name: Check Plugin Version Bump

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check for skip label
        id: skip-check
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-version-check') }}" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.skip-check.outputs.skip == 'true'
        run: echo "::notice::Version check skipped via 'skip-version-check' label"

      - name: Checkout
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        if: steps.skip-check.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          VERSION_FILE="plugins/sdlc/.claude-plugin/plugin.json"
          BASE_VERSION="$(git show "${BASE_SHA}:${VERSION_FILE}" 2>/dev/null | jq -r '.version // empty' || true)"
          HEAD_VERSION="$(jq -r '.version // empty' "$VERSION_FILE")"

          if [[ -z "$HEAD_VERSION" ]]; then
            echo "::error file=${VERSION_FILE}::Could not read a version from ${VERSION_FILE}"
            exit 2
          fi

          if [[ -z "$BASE_VERSION" ]]; then
            echo "PASS: ${VERSION_FILE} is new — version ${HEAD_VERSION}"
            exit 0
          fi

          if [[ "$BASE_VERSION" == "$HEAD_VERSION" ]]; then
            echo "::error file=${VERSION_FILE}::Version was not bumped (still ${HEAD_VERSION}). Update the version in ${VERSION_FILE}."
            exit 1
          fi

          HIGHER="$(printf '%s\n%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -n1)"
          if [[ "$HIGHER" != "$HEAD_VERSION" ]]; then
            echo "::error file=${VERSION_FILE}::Version decreased (${BASE_VERSION} -> ${HEAD_VERSION})."
            exit 1
          fi

          echo "PASS: ${BASE_VERSION} -> ${HEAD_VERSION}"
