name: SDLC Release

# Dispatch-only. There is no "push: tags: v*" trigger.
#
# Release tags can be pushed with any of several credentials, depending on
# what's configured (a GitHub App installation token, a RELEASE_TOKEN PAT, or
# the default GITHUB_TOKEN — see the token chain in release-on-main.cjs /
# promote-release.cjs). Those credentials behave differently for workflow
# triggers: a PAT- or App-token-authored push DOES trigger "push: tags", but
# a GITHUB_TOKEN-authored push never triggers any other workflow. A push
# trigger here would therefore double-run this workflow for PAT/App-pushed
# tags (once from the push trigger, once from release-dispatch.yml) while
# never firing at all for GITHUB_TOKEN-pushed tags. Dispatch-only avoids both
# failure modes: release-dispatch.yml watches "Release on Main" for
# completion and explicitly calls workflow_dispatch on this workflow exactly
# once per tag, regardless of which credential pushed it. See
# release-dispatch.yml for the mechanics.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for pre-release tag
        id: prerelease
        run: |
          ref="${GITHUB_REF_NAME:-}"
          is_pre=$(node .github/scripts/is-prerelease-tag.cjs "$ref")
          if [ "$is_pre" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Ref $ref is a pre-release — skipping binary build."
          fi

      - name: Set up Go
        if: steps.prerelease.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and publish release binaries
        if: steps.prerelease.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
