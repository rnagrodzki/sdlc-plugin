name: Release

# Triggered two ways:
# - push: tags "v*" — fires for a tag pushed with real user credentials (e.g.
#   a manual `git push --tags`).
# - workflow_dispatch — fires from release-dispatch.yml. release-on-main.cjs
#   (in release-on-main.yml) pushes its tag using the default GITHUB_TOKEN,
#   and GitHub Actions does not cascade-trigger other workflows (including
#   this one's tag-push trigger) from GITHUB_TOKEN-authored pushes. This is a
#   repo-local workaround for that limitation — see release-dispatch.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for pre-release tag
        id: prerelease
        run: |
          ref="${GITHUB_REF_NAME:-}"
          remainder=$(echo "$ref" | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+//')
          if [ -n "$remainder" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Ref $ref is a pre-release — skipping binary build."
          fi

      - name: Set up Go
        if: steps.prerelease.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        if: steps.prerelease.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
