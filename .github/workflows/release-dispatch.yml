# Repo-local workaround, not part of the sdlc scaffold template (see
# internal/tools/payloads/release-on-main.yml — this file is intentionally
# absent from that directory). Other projects scaffolded from this plugin
# don't build/publish binaries and don't need this step.
#
# release-on-main.yml runs release-on-main.cjs, which pushes the release
# commit and tag using the default GITHUB_TOKEN. GitHub Actions does not
# cascade-trigger other workflows (including release.yml's "push: tags: v*")
# from GITHUB_TOKEN-authored pushes. This workflow closes that gap: once
# "Release on Main" finishes, it checks whether main's current tip actually
# got tagged (release-on-main.cjs no-ops — exit 0, no tag — on merges without
# a release label, so conclusion alone can't tell success from no-op), and if
# so, explicitly dispatches release.yml at that tag via workflow_dispatch,
# which GITHUB_TOKEN-authored calls are allowed to trigger.
name: Release Dispatch

on:
  workflow_run:
    workflows: ["Release on Main"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Find tag on current main tip
        id: tag
        run: |
          tag=$(git tag --points-at HEAD | head -n1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check if tag is a pre-release
        id: prerelease
        if: steps.tag.outputs.tag != ''
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # Strip leading 'v' and M.M.P core — anything left means pre-release
          remainder=$(echo "$tag" | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+//')
          if [ -n "$remainder" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag is a pre-release — skipping binary build dispatch."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch release build
        if: steps.tag.outputs.tag != '' && steps.prerelease.outputs.is_prerelease != 'true'
        run: gh workflow run release.yml --ref "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
