# Token-agnostic dispatcher for release.yml.
#
# release.yml is dispatch-only (workflow_dispatch: {}, no "push: tags: v*"
# trigger). Release tags can be pushed with any of several credentials — a
# GitHub App installation token, a RELEASE_TOKEN PAT, or the default
# GITHUB_TOKEN (see the token chain in release-on-main.cjs /
# promote-release.cjs) — and those credentials behave differently for
# workflow triggers: a PAT- or App-token-authored push DOES trigger
# "push: tags", but a GITHUB_TOKEN-authored push never triggers any other
# workflow. A push trigger on release.yml would therefore double-run it for
# PAT/App-pushed tags and never run it at all for GITHUB_TOKEN-pushed tags.
# This workflow avoids both failure modes: once "Release on Main" finishes,
# it checks whether main's current tip actually got tagged (release-on-main.cjs
# no-ops — exit 0, no tag — on merges without a release label, so conclusion
# alone can't tell success from no-op), and if so, explicitly dispatches
# release.yml at that tag via workflow_dispatch — exactly once, regardless of
# which credential pushed it.
#
# Repo-local workaround, not part of the sdlc scaffold template (see
# internal/tools/payloads/release-on-main.yml — this file is intentionally
# absent from that directory). Other projects scaffolded from this plugin
# don't build/publish binaries and don't need this step.
name: SDLC Release Dispatch

on:
  workflow_run:
    workflows: ["Release on Main"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve final (non-RC) tag on HEAD
        id: tag
        run: |
          tag=$(git tag --points-at HEAD --sort=-version:refname | grep -v -- '-rc' | head -n1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check if tag is a pre-release
        id: prerelease
        if: steps.tag.outputs.tag != ''
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          is_pre=$(node .github/scripts/is-prerelease-tag.cjs "$tag")
          echo "is_prerelease=$is_pre" >> "$GITHUB_OUTPUT"
          if [ "$is_pre" = "true" ]; then
            echo "Tag $tag is a pre-release — skipping binary build dispatch."
          fi

      - name: Dispatch release build
        if: steps.tag.outputs.tag != '' && steps.prerelease.outputs.is_prerelease != 'true'
        run: gh workflow run release.yml --ref "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
