# release-on-main-version: 5
name: Release on Main

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Optional: mint a GitHub App token when the repo sets vars.RELEASE_APP_CLIENT_ID.
      # The App must be on the bypass list of every ruleset that covers the default
      # branch and release tags. See docs/versioning.md "Protected branches and rulesets".
      - id: release-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release on main
        run: node .github/scripts/release-on-main.cjs
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
