# ─── SDLC Project Configuration (v1) ─────────────────────────────
# Shared across the team — committed to version control.
# Edit this file directly, then run the validate tool to check.

# ─── Versioning ───────────────────────────────────────────────────

[version]
# Current pre-release tag (free-form string, e.g. "rc", "beta", "alpha")
preRelease = "rc"

# When to apply pre-release tags.
# Valid: "always-rc" | "default-rc" | "continue-rc" | "never"
#   always-rc    — every release gets an rc tag
#   default-rc   — rc by default, but explicit CLI --bump overrides to final
#   continue-rc  — only if already in rc
#   never        — skip pre-release, go straight to release
preReleasePolicy = "default-rc"

# How versions reach the remote.
# Valid: "push" | "pr"
#   push — direct push to default branch
#   pr   — create a pull request
method = "push"

[version.tag]
# Create git tags for releases.
enabled = true
# Tag prefix (e.g. "v" → "v1.2.3", "" → "1.2.3")
prefix = "v"

[version.versionFile]
# Write version number to a file on release.
enabled = true
# Path relative to repo root.
path = "plugins/sdlc/.claude-plugin/plugin.json"
# Valid: "package.json" | "plugin.json" | "version.txt" | "pyproject.toml"
fileType = "plugin.json"

[version.changelog]
# Auto-generate changelog from conventional commits.
enabled = true
# Changelog file path relative to repo root.
file = "CHANGELOG.md"

# ─── Plan guardrails ─────────────────────────────────────────────
# Constraints enforced during plan creation (by the plan skill's
# self-critique pass). ID is the table key — TOML enforces uniqueness,
# no duplicate IDs possible.
# severity: "error" (blocking, plan fails) or "warning" (advisory, shown
# but not blocking).
#
# Add project-specific guardrails as new [plan.guardrails.<your-id>] tables.

[plan.guardrails.test-coverage-required]
severity = "error"
description = """
Every task that creates or modifies source code must include corresponding \
test cases. Scripts must be structured as importable modules (entry-point \
main() guarded, e.g. `if (require.main === module)`) before test tasks are \
planned. Tests introduced by a task must be wired into CI in the same plan."""

[plan.guardrails.plan-verification-scope-completeness]
severity = "error"
description = """
Plan Verification commands must account for cross-package dependencies, not \
just the touched package. Specifically: (1) when a task's Files include \
plugins/sdlc/skills/*/SKILL.md or add/change a tool dispatch, Verification \
must include `go test ./internal/skillcheck/...` (or full `go test ./...`) \
to catch tool-registration regressions that per-package tests miss; (2) when \
a task changes a struct's field type (e.g. int -> *int) or JSON tag \
(adding/removing omitempty), Verification must run `go test ./...` at the \
repository root to catch cross-package serialization/marshal regressions. \
Narrow per-package verification scoping has repeatedly missed these \
regressions in this codebase."""

[plan.guardrails.plan-claims-verified-against-source]
severity = "error"
description = """
Any claim a plan makes about existing code, docs, or behavior (method \
signatures, config field names, doc section titles/positions, CLI flag \
semantics, prose descriptions of a mechanism, or the absence of a \
string/pattern in the codebase) must be verified by direct source reading \
(grep/read) before the plan is finalized or the claim is used to justify a \
task's completion. Never assert such claims from memory. This covers: \
contract diffs (reproduce struct/API shapes verbatim from source, never \
invent fields), audit/negative-assertion tasks (verify absence claims with \
grep, not partial search), prose-describing-code tasks (verify prose against \
source, not build/test success alone), and plan Contract blocks containing \
literal code/API/CLI details (verify against current source before \
finalization)."""

[plan.guardrails.wave-start-output-and-taskobject-verification]
severity = "warning"
description = """
When a plan includes steps that dispatch to MCP tools whose outputs are \
consumed by downstream tasks (e.g. wave-start fact sheets), the plan must \
include explicit verification steps confirming output correctness before \
downstream processing. Specifically for wave-start: task objects passed to \
it must include all required metadata (id, title, complexity, risk, \
dependsOn, verify, files, acceptanceCriteria, contract text verbatim from \
the plan's Contract block, notes) -- the tool renders fact sheets from what \
it is given and does not re-derive metadata from the plan file. If metadata \
must be re-derived, use wave-compute first to extract it programmatically \
before constructing the wave-start call."""

[plan.guardrails.no-ci-bypass]
severity = "error"
description = "Plans must not include steps that skip or disable CI checks."

[plan.guardrails.no-scope-creep]
severity = "error"
description = """
Tasks must only address stated requirements; no gold-plating. A task's \
declared Files/line-range scope must be sufficient to achieve everything the \
task's own acceptance criteria and Verification steps require -- scope \
narrower than the task's own stated requirements is a plan defect to fix \
before execution. Conversely, each task's Files section defines the \
exhaustive edit boundary: if a dispatched worker's actual diff scope (file \
count, file list) diverges from the declared Files section, stop immediately \
and present the divergence to the user via AskUserQuestion before proceeding \
with spec-compliance review or commit, even if the broader result \
builds/tests clean."""

[plan.guardrails.single-responsibility-tasks]
severity = "warning"
description = "Each task must have exactly one clear deliverable."

[plan.guardrails.yagni]
severity = "warning"
description = """
Tasks must not add functionality beyond stated requirements — no speculative \
abstractions, premature generalization, or unused parameters."""

[plan.guardrails.dry]
severity = "warning"
description = """
Tasks must not duplicate logic that exists elsewhere — reuse existing \
functions or extract shared utilities."""

[plan.guardrails.kiss]
severity = "warning"
description = """
Tasks must prefer the simplest design that satisfies requirements — avoid \
unnecessary abstractions and over-engineering."""

[plan.guardrails.state-premise]
severity = "error"
description = """
Plan must state the underlying problem in one sentence — in Goal, \
Architecture, or Key Decisions. Reject plans that transcribe requirements \
without naming the root problem."""

[plan.guardrails.smallest-viable-cut]
severity = "warning"
description = """
Plan must identify the smallest version of the work that still delivers \
value. If the plan covers more than the minimum, each extra task must be \
justified in Key Decisions."""

[plan.guardrails.failure-audience]
severity = "warning"
description = """
Plan must name who or what fails if this implementation ships incorrectly \
(user, system, team, downstream service). Surfaces the blast radius before \
decomposition."""

[plan.guardrails.explicit-non-goals]
severity = "warning"
description = """
Plan must list what is intentionally NOT being built. Surface adjacent \
improvements that were considered and excluded so reviewers and executors do \
not silently re-expand scope."""

[plan.guardrails.ambiguity-stops-and-asks]
severity = "error"
description = """
When two or more codebase patterns are viable for the same requirement with \
materially different downstream implications, the plan must EITHER record \
the choice in Key Decisions with rationale, OR the skill must \
AskUserQuestion before committing. Silent selection between viable patterns \
is a critique failure."""

[plan.guardrails.mcp-tool-description-precise]
severity = "error"
description = """
Plans touching an MCP tool definition must state precisely what the tool \
does, its inputs/outputs, and when to call it. A vague or generic tool \
description is a blocking issue. When a tool's description or \
Purpose/FilesModified fields cite filesystem paths, extensions, directories, \
or glob patterns, verify the descriptor against the code that loads/walks \
the filesystem -- mismatched or stale path descriptors are blocking issues. \
For multi-action tools, the description must explicitly state what inputs \
are required vs optional for each action, using the "Requires: ... Optional: \
..." convention from execute_state.go."""

[plan.guardrails.skill-mcp-connectivity]
severity = "warning"
description = """
Every skill step that an MCP tool could perform must name the explicit tool \
call — plans must not leave tool-vs-skill wiring to ad hoc LLM judgment."""

[plan.guardrails.mcp-deterministic-work-split]
severity = "error"
description = """
Deterministic, mechanical work (file I/O, shell orchestration, config \
reads/writes, validation) belongs in MCP tools. Skills own only \
non-deterministic judgment (interpretation, drafting, user dialogue). Plans \
must not push deterministic logic into skill markdown."""

[plan.guardrails.payload-clarity-for-llms]
severity = "warning"
description = """
Plans that change tool request/response payloads must assess round-trip \
count and field clarity for LLM consumption. No ambiguous or redundant \
payload shapes."""

[plan.guardrails.tool-orchestrates-fast-descriptive-output]
severity = "error"
description = """
MCP tools must internally chain the shell/file reads and writes needed to \
reach the LLM's goal in one call rather than forcing the LLM to chain many \
round trips, and must return output descriptive enough to act on without \
extra lookups."""

[plan.guardrails.prefer-mcp-over-cli]
severity = "warning"
description = """
Plans must route SDLC-process steps (setup, version, ship, review, commit, \
PR, jira) through this project's MCP tools rather than raw CLI invocations. \
Where an MCP tool covers the step, do not add a task that shells out for the \
same result. Batch what the MCP surface returns in one call rather than \
planning multiple round trips between harness and model."""

[plan.guardrails.mcp-tool-count-discipline]
severity = "warning"
description = """
Before adding a new MCP tool, verify the operation cannot be absorbed into \
an existing tool via action dispatch or input extension. Each tool adds \
schema bytes to every LLM invocation context. Prefer extending over \
creating."""

[plan.guardrails.mcp-output-llm-contract]
severity = "error"
description = """
MCP tool outputs are consumed by an LLM, not a programmatic API client. \
Return contextually rich responses: include field names that read as natural \
language, add summary sentences alongside raw data, include relevant context \
the LLM needs to reason about the result. A tool returning {status: \
'failed', code: 3} is useless; returning {status: 'failed', reason: \
'Template file not found at .sdlc-v2/plan-template.md', context: 'Project \
has no custom template -- shipped default will be used'} lets the LLM act."""

[plan.guardrails.mcp-output-action-hints]
severity = "warning"
description = """
When an MCP tool output implies a natural next step, include an 'actions' or \
'next' field with plain-language instructions the LLM can follow. Example: a \
merge_results output with coverage gaps should include: next: 'Re-dispatch \
lanes for missing gates: G14, G17. If re-dispatch also fails, escalate to \
user via AskUserQuestion.' Do not force the LLM to re-derive next steps from \
raw data."""

[plan.guardrails.mcp-error-actionable]
severity = "error"
description = """
MCP tool errors must tell the LLM what went wrong AND what to do about it. \
Not a stack trace -- a diagnosis + recovery instruction. Example: instead of \
'ENOENT: .sdlc-v2/config.json', return 'Config file .sdlc-v2/config.json not \
found. Run setup_init to create it, or pass skipConfigCheck: true to proceed \
without config.' The LLM cannot debug infrastructure errors -- it needs \
actionable alternatives."""

[plan.guardrails.handler-data-contracts]
severity = "error"
description = """
Plans that create or modify tool handlers or data-transformation pipelines \
must explicitly document nil/empty-collection edge cases and how they are \
normalized. Handlers must normalize nil to empty array/object at the \
dispatcher level before returning output; this normalization must happen \
within the handler, not left to downstream serialization or LLM \
interpretation. Handlers must also validate input parameter shapes (required \
fields present, types correct) and reject invalid inputs with actionable \
errors BEFORE processing -- do not silently accept malformed input and \
produce corrupted downstream state."""

[plan.guardrails.no-real-fs-git-in-tests]
severity = "error"
description = """
Tests must not perform real filesystem operations (os.WriteFile, os.Create, \
os.MkdirTemp, t.TempDir) or execute real git/gh commands (exec.Command, \
execx.Run). Use dependency injection with mock/fake implementations instead. \
Existing test helpers like stubGHDispatch that write to temp directories \
violate this rule."""

[plan.guardrails.mcp-error-has-suggestion]
severity = "error"
description = """
Every new MCP error return path where recovery is possible must populate the \
Suggestion field on DomainError/InfraError/DataError. Raw error messages \
without structured recovery hints force the LLM to parse free-text."""

[plan.guardrails.mcp-output-drives-behavior]
severity = "error"
description = """
Every *Out struct (tool output) MUST include a Next string field \
(json:"next", no omitempty) with an exact per-outcome hint guiding the LLM's \
next action. Outputs must always include Next in JSON; empty string is valid \
for "no next step", but an absent field violates the contract."""

[plan.guardrails.mcp-parameter-documented]
severity = "error"
description = """
Every exported field on an *In struct must have a jsonschema_description \
tag. The description must explicitly state whether the field accepts \
plain-text strings or JSON-encoded input, and must provide a concrete \
example value. Fields representing closed sets (validated by switch/const) \
must additionally have a jsonschema enum tag. Undocumented or \
ambiguously-encoded parameters create ambiguity for the LLM and cause \
trial-and-error tool-call failures."""

[plan.guardrails.stateless-tool-input-protocol]
severity = "error"
description = """
When a plan calls an MCP tool that re-resolves full state from a single \
input per invocation (e.g. setup_prepare({reply})), explicitly document in \
the plan that the tool requires full accumulated input on every call -- \
never send only partial or delta input. Include a two-call test scenario in \
the plan proving the accumulation protocol. Similarly, calls to \
material_compare or similar diff tools must pass the FULL prior artifact \
snapshot, not a summary or excerpt -- partial snapshots produce spurious \
drift reports and mask the actual changes being validated."""

[plan.guardrails.sub-skill-approval-orchestration]
severity = "warning"
description = """
When a plan modifies a SKILL.md that dispatches another skill via the Agent \
tool, the plan must explicitly document how approval gates in the dispatched \
skill will be satisfied. Agent-tool sub-agents cannot call AskUserQuestion \
directly -- the orchestrator must plan to receive the sub-agent's request, \
call AskUserQuestion at orchestrator level, and relay the answer back via \
SendMessage."""

[plan.guardrails.trivial-task-contract-complexity]
severity = "warning"
description = """
Tasks whose Contract blocks specify precise conditional logic, branching, \
state transitions, or specific function calls must not be classified Trivial \
by file-count alone. Trivial classification is appropriate only for straight \
prose additions. Tasks with logic contracts require Standard-level scrutiny."""

[plan.guardrails.plan-verification-soundness]
severity = "warning"
description = """
Plan's Verification section must be logically consistent with the plan's own \
Key Decisions and Non-goals; a repo-wide grep for removal verification must \
explicitly exclude files that Key Decisions/Non-goals exempt from that \
removal."""

[plan.guardrails.schema-change-secondary-readers]
severity = "error"
description = """
When a plan changes a config or data schema structure, identify all readers, \
writers, migrators, codegen, test fixtures, AND template files \
(plugins/sdlc/templates/*.toml) that consume the schema -- do not assume the \
declared-files list captures the scope. Template examples and comments must \
validate against the schema; the Verification section must explicitly check \
template-schema conformance (e.g. by reading templates and confirming all \
enums/constraints match the schema) before marking the task done. Use grep, \
package-import analysis, and full-module testing before marking the plan \
done."""

[plan.guardrails.schema-code-sync-required]
severity = "error"
description = """
When a task modifies an MCP tool's input/output structs, a Go config struct \
(internal/config/), or an enum field that is serialized to JSON or TOML, both \
the corresponding JSON schema under plugins/sdlc/schemas/ AND the config \
template at plugins/sdlc/templates/*.toml must be updated in the same task. \
Schemas, code, and templates must not drift -- validate that marshaled Go \
instances conform to the schema and that template field names and defaults \
stay synchronized with the schema before submission."""

[plan.guardrails.refactoring-includes-doc-sweep]
severity = "warning"
description = """
Tasks that involve configuration/API renames or major refactoring must \
include documentation and schema updates in the same task -- do not defer \
doc and schema sweeps to follow-up work. Plan must explicitly enumerate \
which docs, READMEs, skill descriptions, and JSON schemas will be updated \
alongside code changes."""

[plan.guardrails.constant-literal-migration-complete]
severity = "error"
description = """
When a task introduces a new constant to replace previously hardcoded string \
literals, the task's Verification section must include an explicit check \
(e.g. `grep -rn "<old_literal>" <scope> --include=*.go`) to confirm zero \
remaining instances outside intentional legacy-fallback paths. A partial \
migration creates two silently-diverging sources of truth and is worse than \
not migrating at all."""

[plan.guardrails.task-dependency-merge-gate]
severity = "error"
description = """
Tasks whose Contract runs commands that mutate production/release state (gh \
release edit, gh workflow run, tag push, merge to release branch) must not \
execute in branch-only runs. Either structure the execute run to merge to \
the default branch, or declare the task's dependency on upstream tasks \
landing first via a structured dependency field -- prose Notes alone are not \
validated at plan time."""

[plan.guardrails.task-contract-cross-file-dependencies]
severity = "error"
description = """
When a task's files list includes a file that appears as a key in a \
pinned-hash map (e.g. planSkillsReferenceFileHashes) or other cross-file \
guard, the task's acceptance criteria must explicitly document the coupling \
and required guard-update step."""

# ─── Execute guardrails ──────────────────────────────────────────
# Constraints enforced during task execution (by the execute skill's
# self-critique pass). Same format and severity semantics as plan
# guardrails above.

[execute.guardrails.prefer-mcp-over-cli]
severity = "warning"
description = """
Do not shell out via CLI for a step this project's MCP tools already cover \
(setup, version, ship, review, commit, PR, jira). Call the MCP tool instead, \
and batch multiple checks into as few calls as possible — every extra CLI \
round trip between harness and model slows execution and fragments feedback."""

[execute.guardrails.no-real-fs-git-in-tests]
severity = "error"
description = """
Tests must not perform real filesystem operations (os.WriteFile, os.Create, \
os.MkdirTemp, t.TempDir) or execute real git/gh commands (exec.Command, \
execx.Run). Use dependency injection with mock/fake implementations instead. \
Existing test helpers like stubGHDispatch that write to temp directories \
violate this rule."""

[execute.guardrails.mcp-schema-tags-required]
severity = "error"
description = """
New or modified *In and *Out structs must have jsonschema_description tags \
on all exported fields. *In fields representing closed sets must also have \
jsonschema enum tags. *Out structs must have concrete types (never `any`) \
and handlers must call both WithInputSchema[StructIn]() and \
WithOutputSchema[StructOut]() to expose complete schemas to the LLM. Before \
marking done, execute: (1) grep for every switch statement validating an \
*In field and cross-reference the field's enum tag to confirm all case \
labels are present; (2) grep for every DomainError/InfraError/DataError \
instantiation and verify Suggestion field is set (including in \
default/fallthrough branches). (3) Run go build and go test to verify \
schemas are generated and contain non-empty descriptions. Document audit \
in task verification."""

[execute.guardrails.skill-tool-param-sync]
severity = "error"
description = """
When a SKILL.md dispatches an MCP tool, every parameter name in the dispatch \
args must match a json tag on the tool's *In struct, and every parameter \
must include both name and value (no bare flags). Additionally, every MCP \
tool referenced in a SKILL.md must be registered via Register*Tools in all \
internal/skillcheck/*_test.go shared registries (planSkillsListTools, \
executeSkillsListTools, etc.). Mismatched parameter names, bare flags, or \
missing registrations silently break tool behavior or cause resolver \
failures."""

[execute.guardrails.wave-start-dispatch-input-integrity]
severity = "warning"
description = """
Before dispatching to MCP tools, code must validate that constructed inputs \
match the tool's documented schema in field names, types, and structure. \
Specifically for wave-start: pass complete task objects with all required \
fields (id, title, complexity, risk, dependsOn, verify, files, \
acceptanceCriteria, contract, notes) -- the tool renders fact sheets from \
what it is given and does not re-derive task metadata from the plan file \
server-side. The dispatcher must also validate wave-start's tasksJson \
task-name-to-task-id mapping before sending to workers; a mislabel silently \
corrupts the fact sheet a worker receives and produces a phantom success \
report on the wrong task."""

[execute.guardrails.no-silent-fs-state-discard]
severity = "error"
description = """
Do not silently discard errors returned from file-system operations \
(os.WriteFile, os.Remove, os.MkdirTemp, t.TempDir) or state-persistence \
operations (state.Write, storage reads) when the next line reports success \
to the caller. Propagate the error, explicitly handle it with a non-silent \
fallback, or explicitly document why it is safe to ignore."""

[execute.guardrails.independent-completion-reverification]
severity = "error"
description = """
Never record task-done or wave-done from a self-report alone. A passing \
self-report is a claim, not evidence of correctness. Always independently \
confirm via `git diff --stat` scoped to expected files, then a full `git \
diff` read, then an independent re-run of the relevant build/vet/test \
commands -- run `go test ./...` (full suite), not just the plan's named \
per-package verify command, before marking any task done that changes a \
struct's field type or JSON tag. Do not trust pasted command output or \
worker/agent/coordinator self-reports of completion."""

[execute.guardrails.execute-handler-nil-normalization]
severity = "error"
description = """
MCP tool handlers must normalize nil slices and maps to empty []T or \
map[K]V{} before returning. Nil collections serialize to JSON `null`, which \
breaks LLM consumption. Every handler that builds or filters a collection \
must check for nil at the dispatcher level and return empty instead -- \
verify this at execute time, not just in the plan's stated contract."""

[execute.guardrails.spec-compliance-literal-contract-diff]
severity = "error"
description = """
Spec-compliance review of task completeness must perform literal \
contract-vs-diff comparison for any task with a Contract block, including \
Trivial tasks. Do not rely on plausibility checks or self-reported \
completion status."""

[execute.guardrails.worker-diff-matches-plan-files]
severity = "error"
description = """
When a dispatched worker's actual diff scope (file count, file list) \
diverges from the task's Files section, stop and present the divergence to \
the user via AskUserQuestion before running spec-compliance review or \
committing -- even if the broader result builds/tests clean."""

[execute.guardrails.constant-literal-migration-verified-complete]
severity = "error"
description = """
Before marking a task done that introduces a named constant to replace \
previously hardcoded string literals, execute a grep across the repo for the \
old literal and confirm zero remaining instances (outside intentional \
legacy-fallback paths). An incomplete rename creates two silently-diverging \
sources of truth and is worse than not renaming at all."""

[execute.guardrails.defer-unmet-task-dependencies]
severity = "error"
description = """
If a task's own dependency/notes field declares it must run after other \
tasks land on the default branch, and the current execute run produces only \
a feature branch/PR, record the task via task-fail with \
skippedDependency:true and a detailed reason -- do not execute its commands. \
This prevents premature mutation of live release state when upstream tasks \
have not yet landed."""

[execute.guardrails.go-doc-comment-compliance]
severity = "warning"
description = """
Before marking a task done that introduces or modifies exported Go \
identifiers (var, const, func, type at package scope), verify each is \
immediately preceded by a `//` doc comment (not a `//go:embed` directive \
or other Go directive alone) following Go's documentation conventions. \
Additionally, verify that any comment block preceding a `package` \
declaration is separated by a blank line to prevent the comment from being \
misattached as the package doc string. Use `grep -n \
'^\\(var\\|const\\|func\\|type\\) [A-Z]' <changed_file>` and confirm each \
match has a `//` comment line immediately above."""

[execute.guardrails."schema-enum-code-sync-verified"]
severity = "error"
description = """\
Before marking a task done that modifies plugins/sdlc/schemas/sdlc-config.schema.json, \
grep internal/config/config.go for the field names and enum values in the modified \
schema sections. Verify every enum value in the schema is recognized by the Go code \
(typically a const iota or switch branch). Missing an enum value from the Go side \
means the schema accepts values the code rejects, breaking configuration."""

[execute.guardrails.config-schema-template-sync-verified]
severity = "error"
description = """\
Before marking a task done that modifies internal/config/** or \
plugins/sdlc/schemas/sdlc-config.schema.json or plugins/sdlc/templates/*.toml, \
independently verify that all three stay synchronized: grep template comments \
and field names against schema enums and keys, and validate the template TOML \
against the JSON schema. A passing TestConfigTemplateRoundTrip indicates parser \
acceptance only, not schema parity -- both must be verified. Do not defer \
template sync as a 'documentation-only gap'."""

[execute.guardrails.mcp-error-suggestion-coverage]
severity = "error"
description = """
Before marking a task done that modifies error-returning handlers in \
internal/tools/ or internal/mcpserver/, audit all DomainError/InfraError/ \
DataError instantiations. Run: `grep -n 'DomainError{\\|InfraError{\\| \
DataError{' internal/tools/MODIFIED.go internal/mcpserver/MODIFIED.go \
2>/dev/null` and verify every match instantiates a Suggestion field with a \
non-empty literal string or variable reference (never rely on omitempty to \
skip the field). Suggestion must encode a recovery instruction for the \
caller, not a generic message. Document the grep result and verified \
instances in task verification section before marking done."""
