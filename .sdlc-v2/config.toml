# ─── SDLC Project Configuration (v1) ─────────────────────────────
# Shared across the team — committed to version control.
# Edit this file directly, then run the validate tool to check.

# ─── Versioning ───────────────────────────────────────────────────

[version]
# Current pre-release tag (free-form string, e.g. "rc", "beta", "alpha")
preRelease = "rc"

# When to apply pre-release tags.
# Valid: "always-rc" | "default-rc" | "continue-rc" | "never"
#   always-rc    — every release gets an rc tag
#   default-rc   — rc by default, but explicit CLI --bump overrides to final
#   continue-rc  — only if already in rc
#   never        — skip pre-release, go straight to release
preReleasePolicy = "default-rc"

# How versions reach the remote.
# Valid: "push" | "pr"
#   push — direct push to default branch
#   pr   — create a pull request
method = "push"

[version.tag]
# Create git tags for releases.
enabled = true
# Tag prefix (e.g. "v" → "v1.2.3", "" → "1.2.3")
prefix = "v"

[version.versionFile]
# Write version number to a file on release.
enabled = true
# Path relative to repo root.
path = "plugins/sdlc/.claude-plugin/plugin.json"
# Valid: "package.json" | "plugin.json" | "version.txt" | "pyproject.toml"
fileType = "plugin.json"

[version.changelog]
# Auto-generate changelog from conventional commits.
enabled = true
# Changelog file path relative to repo root.
file = "CHANGELOG.md"

# ─── Plan guardrails ─────────────────────────────────────────────
# Constraints enforced during plan creation (by the plan skill's
# self-critique pass). ID is the table key — TOML enforces uniqueness,
# no duplicate IDs possible.
# severity: "error" (blocking, plan fails) or "warning" (advisory, shown
# but not blocking).
#
# Add project-specific guardrails as new [plan.guardrails.<your-id>] tables.

[plan.guardrails.test-coverage-required]
severity = "error"
description = """
Every task that creates or modifies source code must include corresponding \
test cases. Scripts must be structured as importable modules (entry-point \
main() guarded, e.g. `if (require.main === module)`) before test tasks are \
planned. Tests introduced by a task must be wired into CI in the same plan. \
For JS/Node scripts, this means an actual `node --test` (or equivalent) \
invocation in the CI workflow file -- verify the workflow file runs the new \
test file, not just that the test file exists. When adding new conditional \
branches, error paths, or alternative flows to any function, including \
internal helper functions (e.g. in packages like internal/commstyle), each \
new branch must have an explicit test case that exercises it. A task that \
adds a new warning/error branch without a test case exercising that branch \
is incomplete. When a refactor removes or widens a guard (e.g. drops a method \
check), every newly admitted input combination needs its own test case."""

[plan.guardrails.plan-verification-scope-completeness]
severity = "error"
description = """
Plan Verification commands must account for cross-package dependencies, not \
just the touched package. Specifically: (1) Files including \
plugins/sdlc/skills/*/SKILL.md or a tool-dispatch change require `go test \
./internal/skillcheck/...` (or full `go test ./...`) to catch registration \
regressions; (2) a struct field-type or JSON-tag change requires `go test \
./...` at repo root for cross-package serialization regressions; (3) an MCP \
tool binary/server change requires a redeploy/reload-plugins step before \
tool-invocation verification; (4) a config/data schema change requires \
integration-tagged tests, not just unit tests; (5) a SKILL.md prose edit \
that shifts line numbers requires re-running any line-keyed exception map \
(e.g. skillcheck) against the new numbers. Narrow per-package scoping has \
repeatedly missed these regressions."""

[plan.guardrails.plan-claims-verified-against-source]
severity = "error"
description = """
Every claim the plan makes about existing code, docs, or behavior must cite its source as file:line, or name the grep or read command that verified it. Claims covered: method signatures, config field names, doc section titles and positions, CLI flag semantics, prose descriptions of a mechanism, and the absence of a string or pattern. A claim without a citation is a plan defect. Contract blocks with literal code, API, or CLI details must cite the current source. A claim that a design element mirrors an existing pattern must cite the exact file:line, not a paraphrase. MCP tool annotation and reason strings must cite the call-graph search that verified them."""

[plan.guardrails.no-ci-bypass]
severity = "error"
description = "Plans must not include steps that skip or disable CI checks."

[plan.guardrails.no-scope-creep]
severity = "error"
description = """
Tasks must only address stated requirements; no gold-plating. A task's \
declared Files/line-range scope must be sufficient to achieve everything the \
task's own acceptance criteria and Verification steps require -- scope \
narrower than the task's own stated requirements is a plan defect to fix \
before execution."""

[plan.guardrails.single-responsibility-tasks]
severity = "warning"
description = "Each task must have exactly one clear deliverable."

[plan.guardrails.yagni]
severity = "warning"
description = """
Tasks must not add functionality beyond stated requirements — no speculative \
abstractions, premature generalization, or unused parameters."""

[plan.guardrails.dry]
severity = "warning"
description = """
Tasks must not duplicate logic that exists elsewhere — reuse existing \
functions or extract shared utilities. Enum-like literal value lists (e.g. \
phase names, status codes) must be defined once and referenced from a \
single canonical source, not re-typed as free-text literals across \
multiple files or templates. When a codebase contains two or more \
near-identical code paths (e.g. two polling loops, two error-classification \
switches), a fix applied to one path must either be mirrored to the other \
immediately or the paths must be consolidated — a divergent fix is worse \
than not fixing at all. For the copy-pasted CI payloads \
(internal/tools/payloads/*.cjs), grep every sibling that shares the same push \
helper, workflow input or error classifier before scoping a cross-cutting \
change, and list each sibling in the task's file scope."""

[plan.guardrails.kiss]
severity = "warning"
description = """
Tasks must prefer the simplest design that satisfies requirements — avoid \
unnecessary abstractions and over-engineering."""

[plan.guardrails.state-premise]
severity = "error"
description = """
Plan must state the underlying problem in one sentence — in Goal, \
Architecture, or Key Decisions. Reject plans that transcribe requirements \
without naming the root problem."""

[plan.guardrails.smallest-viable-cut]
severity = "warning"
description = """
Plan must identify the smallest version of the work that still delivers \
value. If the plan covers more than the minimum, each extra task must be \
justified in Key Decisions."""

[plan.guardrails.failure-audience]
severity = "warning"
description = """
Plan must name who or what fails if this implementation ships incorrectly \
(user, system, team, downstream service). Surfaces the blast radius before \
decomposition."""

[plan.guardrails.explicit-non-goals]
severity = "warning"
description = """
Plan must list what is intentionally NOT being built. Surface adjacent \
improvements that were considered and excluded so reviewers and executors do \
not silently re-expand scope."""

[plan.guardrails.ambiguity-stops-and-asks]
severity = "error"
description = 'When two or more codebase patterns are viable for the same requirement with materially different downstream implications, the plan must EITHER record the choice in Key Decisions with rationale, OR the skill must AskUserQuestion before committing. Silent selection between viable patterns is a critique failure.'

[plan.guardrails.mcp-tool-description-precise]
severity = "error"
description = "Plans touching an MCP tool definition must state precisely what the tool does, its inputs/outputs, and when to call it. A vague or generic tool description is a blocking issue. When a tool's description or Purpose/FilesModified fields cite filesystem paths, extensions, directories, or glob patterns, verify the descriptor against the code that loads/walks the filesystem -- mismatched or stale path descriptors are blocking issues. For multi-action tools, the description must explicitly state what inputs are required vs optional for each action, using the \"Requires: ... Optional: ...\" convention from execute_state.go. When adding a new action or side effect to an existing tool handler, update the description to name the new side effect and its error-handling contract before marking the task done. Name every persisted source an action reads, such as a ledger or state file, in the description too."

[plan.guardrails.skill-mcp-connectivity]
severity = "warning"
description = """
Every skill step that an MCP tool could perform must name the explicit tool \
call — plans must not leave tool-vs-skill wiring to ad hoc LLM judgment."""

[plan.guardrails.mcp-deterministic-work-split]
severity = "warning"
description = """
Deterministic, mechanical work (file I/O, shell orchestration, config \
reads/writes, validation) belongs in MCP tools. Skills own only \
non-deterministic judgment (interpretation, drafting, user dialogue). Plans \
must not push deterministic logic into skill markdown."""

[plan.guardrails.payload-clarity-for-llms]
severity = "warning"
description = """
Plans that change tool request/response payloads must assess round-trip \
count and field clarity for LLM consumption. No ambiguous or redundant \
payload shapes."""

[plan.guardrails.tool-orchestrates-fast-descriptive-output]
severity = "warning"
description = """
MCP tools must internally chain the shell/file reads and writes needed to \
reach the LLM's goal in one call rather than forcing the LLM to chain many \
round trips, and must return output descriptive enough to act on without \
extra lookups."""

[plan.guardrails.prefer-mcp-over-cli]
severity = "warning"
description = """
Plans must route SDLC-process steps (setup, version, ship, review, commit, \
PR, jira) through this project's MCP tools rather than raw CLI invocations. \
Where an MCP tool covers the step, do not add a task that shells out for the \
same result. Batch what the MCP surface returns in one call rather than \
planning multiple round trips between harness and model."""

[plan.guardrails.mcp-tool-count-discipline]
severity = "warning"
description = """
Before adding a new MCP tool, verify the operation cannot be absorbed into \
an existing tool via action dispatch or input extension. Each tool adds \
schema bytes to every LLM invocation context. Prefer extending over \
creating."""

[plan.guardrails.mcp-output-llm-contract]
severity = "error"
description = """
MCP tool outputs are consumed by an LLM, not a programmatic API client. \
Return contextually rich responses: include field names that read as natural \
language, add summary sentences alongside raw data, include relevant context \
the LLM needs to reason about the result. A tool returning {status: \
'failed', code: 3} is useless; returning {status: 'failed', reason: \
'Template file not found at .sdlc-v2/plan-template.md', context: 'Project \
has no custom template -- shipped default will be used'} lets the LLM act."""

[plan.guardrails.mcp-error-actionable]
severity = "error"
description = """
MCP tool errors must tell the LLM what went wrong AND what to do about it. \
Not a stack trace -- a diagnosis + recovery instruction. Example: instead of \
'ENOENT: .sdlc-v2/config.json', return 'Config file .sdlc-v2/config.json not \
found. Run setup_init to create it, or pass skipConfigCheck: true to proceed \
without config.' The LLM cannot debug infrastructure errors -- it needs \
actionable alternatives.
Every new MCP error return path where recovery is possible must populate the Suggestion field on DomainError, InfraError, or DataError. A no-op or empty outcome (for example 'nothing to promote') counts as a recoverable path, so its error return must populate Suggestion too. The Suggestion must name a recovery action that can clear this specific error. Naming a tool or action that cannot accept the failing input is a plan defect."""

[plan.guardrails.handler-data-contracts]
severity = "error"
description = """
Plans that create or modify tool handlers or data-transformation pipelines \
must explicitly document nil/empty-collection edge cases and how they are \
normalized. A nil or empty collection must render as an explicit, visible \
marker at the dispatcher level before the result leaves the plugin; it must \
never render as a blank line, a heading with nothing under it, or the word \
"null". This normalization happens inside the plugin, never left to LLM \
interpretation. Handlers must also validate input parameter shapes (required \
fields present, types correct) and reject invalid inputs with actionable \
errors BEFORE processing -- do not silently accept malformed input and \
produce corrupted downstream state. Values read from config or state files \
and spliced into generated artifacts (workflow YAML, templated code, shell \
scripts) must be validated against the destination syntax first; a bad value \
fails as a DomainError with a recovery step."""

[plan.guardrails.no-real-fs-git-in-tests]
severity = "error"
description = """
Tests must not write outside t.TempDir, call real gh, or reach the network. \
Real filesystem operations inside t.TempDir (os.WriteFile, os.MkdirTemp) \
are allowed. Real git commands are allowed in a temporary repository \
created under t.TempDir. Reason: a temp dir is isolated and removed \
automatically, and a fake git can pass while real git use is broken. Use \
dependency injection with fakes for gh, for the network, and for a failure \
a real filesystem cannot produce on demand (a full disk, a permission error \
in the middle of a write). When a plan's test tasks need such a failure, \
the plan must cite an existing injectable seam (a function parameter or \
dependency) in the code under test, or include a task to introduce one and \
order it before the test tasks."""

[plan.guardrails.mcp-output-drives-behavior]
severity = "error"
description = "Every tool result MUST tell the LLM what to do next. A tool whose result has a next step supplies it as a root-level `next` string field, which the renderer hoists to the `**Next:**` line. Terminal describes the whole tool, never one outcome: a genuinely terminal tool may omit the field only when its tool description says so. Every outcome of a non-terminal tool, including no-op outcomes such as 'nothing to promote', must set `next`. A result whose next step is implied but unstated violates the contract. Example: a merge_results output with coverage gaps sets next to 'Re-dispatch lanes for missing gates: G14, G17. If re-dispatch also fails, escalate to user via AskUserQuestion.' Do not force the LLM to re-derive next steps from raw data."

[plan.guardrails.stateless-tool-input-protocol]
severity = "error"
description = """
When a plan calls an MCP tool that re-resolves full state from a single \
input per invocation (e.g. setup_prepare({reply})), explicitly document in \
the plan that the tool requires full accumulated input on every call -- \
never send only partial or delta input. Include a two-call test scenario in \
the plan proving the accumulation protocol. Similarly, calls to \
material_compare or similar diff tools must pass the FULL prior artifact \
snapshot, not a summary or excerpt -- partial snapshots produce spurious \
drift reports and mask the actual changes being validated."""

[plan.guardrails.sub-skill-approval-orchestration]
severity = "error"
description = 'When a plan modifies a SKILL.md that dispatches a skill or spawns Agent-tool workers, the plan must document how approval gates in the dispatched skill are satisfied and how abandoned workers are terminated. Agent-tool sub-agents cannot call AskUserQuestion directly, so the orchestrator receives the request, calls AskUserQuestion itself, and relays the answer via SendMessage. The plan must also document how stall or authorization errors from a nested dispatch (e.g. TaskStop refused inside /ship nesting execute or review) are surfaced to and handled by the top-level orchestrator. When workers are abandoned (stall, error, interrupt, or cancel), the plan must verify explicit cleanup via TaskStop or equivalent in all cleanup paths. If a stop fails, the plan must name a fallback and list each worker it could not stop. A dispatch that returns no task ID counts as a worker that cannot be stopped.'

[plan.guardrails.acceptance-criteria-all-options-viable]
severity = "warning"
description = """
When a task's acceptance criteria offer the executor a choice between \
multiple options (e.g. "use X or Y"), each offered option must be \
independently viable in the current codebase/environment -- verify each \
option's preconditions before including it, not just the option ultimately \
expected to be chosen. An AC offering a non-viable option is a plan \
defect."""

[plan.guardrails.trivial-task-contract-complexity]
severity = "warning"
description = """
Tasks whose Contract blocks specify precise conditional logic, branching, \
state transitions, or specific function calls must not be classified Trivial \
by file-count alone. Trivial classification is appropriate only for straight \
prose additions. Tasks with logic contracts require Standard-level scrutiny."""

[plan.guardrails.plan-verification-soundness]
severity = "warning"
description = """
Plan's Verification section must be logically consistent with the plan's own \
Key Decisions and Non-goals; a repo-wide grep for removal verification must \
explicitly exclude files that Key Decisions/Non-goals exempt from that \
removal. When the removal-grep is scoped to specific search terms, it must \
be cross-checked with a second independent method (e.g. a broader wildcard \
grep across all file extensions, or LSP findReferences) to catch call sites \
the primary search terms miss."""

[plan.guardrails.schema-change-secondary-readers]
severity = "error"
description = """
When a plan changes a config or data schema structure, identify all readers, \
writers, migrators, codegen, test fixtures, AND template files \
(plugins/sdlc/templates/*.toml) that consume the schema -- do not assume the \
declared-files list captures the scope. Also identify CI workflow files \
(.github/workflows/*.yml) and documentation (docs/, README) that reference \
schema fields or examples. When the schema change introduces a new numeric \
limit, threshold, or cap field, verify that user-facing documentation \
(docs/, skill prose, README) explains the key, default value, valid range, \
and adjustment procedure; schema descriptions do not count as user \
documentation. Template examples and comments must validate against the \
schema; the Verification section must explicitly check template-schema \
conformance (e.g. by reading templates and confirming all enums/constraints \
match the schema) before marking the task done. Use grep, package-import \
analysis, and full-module testing before marking the plan done.
When a task modifies an MCP tool's input or output structs, a Go config struct (internal/config/), or an enum field serialized to JSON or TOML, the JSON schema under plugins/sdlc/schemas/ and the config template at plugins/sdlc/templates/*.toml must both be updated in the same task. Schemas, code, and templates must not drift. Check that description prose (permissions, defaults) matches the code, and that each prose default is a structured schema default keyword."""

[plan.guardrails.refactoring-includes-doc-sweep]
severity = "warning"
description = """
Tasks that involve configuration/API renames or major refactoring must \
include documentation and schema updates in the same task -- do not defer \
doc and schema sweeps to follow-up work. When documentation updates occur, \
the plan must verify that the update is comprehensive: (1) grep all \
relevant documentation files (docs/, plugins/sdlc/skills/**/*.md, README, \
SKILL.md files) for old key/API names to confirm all mentions are updated, \
not just the primary section; (2) for SKILL.md migrations that change or add \
flags, cross-check the front-matter argument-hint against all tables/sections \
in the corresponding docs/skills/*.md file (Flags table, Arguments, Tips, \
examples) to verify every declared flag is documented. Plan must explicitly \
enumerate which docs, READMEs, skill descriptions, and JSON schemas will be \
updated alongside code changes, and include verification steps that confirm \
completeness."""

[plan.guardrails.constant-literal-migration-complete]
severity = "error"
description = """
When a task introduces a new constant to replace previously hardcoded string \
literals, the task's Verification section must include an explicit check \
(e.g. `grep -rn "<old_literal>" <scope> --include=*.go`) to confirm zero \
remaining instances outside intentional legacy-fallback paths. A partial \
migration creates two silently-diverging sources of truth and is worse than \
not migrating at all."""

[plan.guardrails.task-dependency-merge-gate]
severity = "error"
description = """
Tasks whose Contract runs commands that mutate production/release state (gh \
release edit, gh workflow run, tag push, merge to release branch) must not \
execute in branch-only runs. Either structure the execute run to merge to \
the default branch, or declare the task's dependency on upstream tasks \
landing first via a structured dependency field -- prose Notes alone are not \
validated at plan time."""

[plan.guardrails.task-contract-cross-file-dependencies]
severity = "error"
description = """
When a task's files list includes a file that appears as a key in a \
pinned-hash map (e.g. planSkillsReferenceFileHashes) or other cross-file \
guard, the task's acceptance criteria must explicitly document the coupling \
and required guard-update step."""

[plan.guardrails.skill-flow-soundness]
severity = "error"
description = """
When a plan task modifies a SKILL.md, the plan must narrate the skill's \
full step flow end-to-end (entry to every exit state) and verify it is \
logically sound before the task is marked done: every step is reachable \
under some valid input, every terminal state (success, cancel, error, \
stall) has an explicit next instruction, gating conditions do not \
contradict each other across steps, every flag in the Arguments table is \
referenced in Workflow and vice versa, and step-number cross-references \
(within the file and in companion sub-flows) are updated after any \
reordering. If the skill dispatches background workers or sub-agents, \
every worker must have explicit cleanup (TaskStop, agent termination, or \
documented self-termination) in the stall handler and all error-recovery \
paths. A flow that reads correctly line-by-line but contains an \
unreachable branch, a dead end, or abandoned workers is still a plan \
defect.
Routing bullets keyed on the same input must be mutually exclusive: walk the boundary states (last round, CRITICAL gate result, single-item batch) against every bullet, and exactly one bullet must match. A state that matches no bullet is a dead end. Each loop or sub-flow must name exactly one return step; a loop with two return targets is a plan defect. When two or more routes write the same persisted record, every route must derive each field from the same named source, or the prose must name the route that wins on conflict. One call described in two places must carry the same arguments in both. A count that routes the flow must include every source, such as findings with no id. A route must not advance on a flag the fixer set about its own work without an independent re-check. When a skill dispatches background workers or sub-agents, the results or final output step must disclose each worker that was missing (dispatch sent, never reported in) or unterminated (stall, error, interrupt, or failed stop with incomplete cleanup), by name or task ID, and the output template must hold a literal slot for each disclosed category. When a plan adds or changes a SKILL.md jump, skip, or go-to route, the plan must list each route with its source step and target step. For each step that a config key or flag can enable, every route into that step must reach it whenever the enabling condition holds; a route that jumps past an enabled step is a plan defect. A step that defers to a tool's returned next string is a route: list each next value with its target step. An offer that hands off to another skill or tool must restate that target's precondition and be skipped when the precondition fails. When a plan task modifies a SKILL.md, the plan must name each Steps overview or header entry the change affects, with its new step number, name, and action, and must update that entry in the same edit as the body step it names. An overview entry left stale after a body edit is a plan defect."""

[plan.guardrails.skill-resume-safety]
severity = "error"
description = """
When a plan task adds or modifies a multi-step SKILL.md workflow, the plan \
must document how that skill behaves if interrupted mid-flow and re-invoked \
(state file re-read, idempotent re-run of already-completed steps, no \
duplicate side effect on a step that partially succeeded). A skill with no \
documented resume behavior is assumed unsafe to re-enter after an \
interruption -- the plan must either add that documentation or explicitly \
justify why the skill is single-shot and re-entry is not a concern. For \
skills using context-compaction recovery, every step that must carry a \
checkpoint marker for safe resume must have an inline plan_mark or \
evidence_record call; a blanket rule stating checkpoints occur at 'steps N \
through M' is insufficient if the actual step bodies lack the inline calls."""

[plan.guardrails.validator-error-propagation-complete]
severity = "error"
description = """
When a task adds or modifies an MCP tool validator (e.g. validatePlanStyle, \
validatePlanFormat in internal/tools/validators.go), the task's Verification \
section must include: (1) a config-read error test case exercising both the \
ErrNotFound and the parse/permission-error outcome for each config.Read or \
config.ReadSection call in the validator; (2) confirmation that every \
config-read error is propagated as a structured error (DomainError or \
InfraError with Suggestion) to the caller, never silently treated as "not \
configured"; (3) when the validator's output struct has no warnings field, \
documented routing showing where the error surfaces instead -- a sibling \
action that already surfaces it, or an explicit fallback-path note. \
Config-read errors silently dropped or defaulted are worse than explicit \
failures -- the user cannot tell if they misconfigured the system."""

# ─── Execute guardrails ──────────────────────────────────────────
# Constraints enforced during task execution (by the execute skill's
# self-critique pass). Same format and severity semantics as plan
# guardrails above.

[execute.guardrails.prefer-mcp-over-cli]
severity = "warning"
description = """
Do not shell out via CLI for a step this project's MCP tools already cover \
(setup, version, ship, review, commit, PR, jira). Call the MCP tool instead, \
and batch multiple checks into as few calls as possible — every extra CLI \
round trip between harness and model slows execution and fragments feedback."""

[execute.guardrails.no-real-fs-git-in-tests]
severity = "error"
description = """
Tests must not write outside t.TempDir, call real gh, or reach the network. \
Real filesystem operations inside t.TempDir (os.WriteFile, os.MkdirTemp) \
are allowed. Real git commands are allowed in a temporary repository \
created under t.TempDir. Reason: a temp dir is isolated and removed \
automatically, and a fake git can pass while real git use is broken. Use \
dependency injection with fakes for gh, for the network, and for a failure \
a real filesystem cannot produce on demand (a full disk, a permission error \
in the middle of a write). Add the injectable seam before writing the test \
that needs it; do not defer it. Do not add a seam only to avoid a temp \
dir."""

[execute.guardrails.mcp-schema-tags-required]
severity = "error"
description = """
New or modified *In and *Out structs must have jsonschema_description tags \
on all exported fields. *In fields representing closed sets must also have \
jsonschema enum tags. *Out structs should have concrete types; `any` is \
permitted for a multi-action tool, because the renderer walks it. Tools \
publish an input schema only -- there is no output schema to expose. Before \
marking done, execute: (1) grep for every switch statement validating an \
*In field and cross-reference the field's enum tag to confirm all case \
labels are present; (2) grep for every DomainError/InfraError/DataError \
instantiation and verify Suggestion field is set (including in \
default/fallthrough branches); (3) grep *In string fields parsed via \
json.Unmarshal and verify their description states the JSON-encoding \
requirement with an example -- a "free-text" or encoding-silent \
description on a JSON-only field is a contract violation; (4) run go build \
and go test to verify schemas are generated. Document audit in task \
verification."""

[execute.guardrails.skill-tool-param-sync]
severity = "error"
description = "When a SKILL.md dispatches an MCP tool, every parameter name in the dispatch args must match a json tag on the tool's *In struct, and every parameter must include both name and value (no bare flags). Additionally, every MCP tool referenced in a SKILL.md must be registered via Register*Tools in all internal/skillcheck/*_test.go shared registries (planSkillsListTools, executeSkillsListTools, etc.). Mismatched parameter names, bare flags, or missing registrations silently break tool behavior or cause resolver failures. Every action value that a SKILL.md dispatch passes must be a member of the tool's action enum (its jsonschema enum tag). A skillcheck test must assert that each dispatched action appears in that enum. Without that test, a drifted action name ships unnoticed."

[execute.guardrails.wave-start-dispatch-input-integrity]
severity = "error"
description = """
Before dispatching to MCP tools, code must validate that constructed inputs \
match the tool's documented schema in field names, types, and structure. \
Specifically for wave-start: pass complete task objects with all required \
fields (id, name, complexity, risk, dependsOn, verify, files, \
acceptanceCriteria, contract, notes) -- the tool renders fact sheets from \
what it is given and does not re-derive task metadata from the plan file \
server-side. The dispatcher must also validate wave-start's tasksJson \
task-name-to-task-id mapping before sending to workers; a mislabel silently \
corrupts the fact sheet a worker receives. For task-done/wave-done, \
filesAdded must be validated as a subset of filesChanged before dispatch, \
and status values must use the tool's declared enum (e.g. \
DONE_WITH_CONCERNS is distinct from DONE) -- do not invent status \
strings."""

[execute.guardrails.no-silent-fs-state-discard]
severity = "error"
description = """
Do not silently discard errors returned from file-system operations \
(os.WriteFile, os.Remove, os.MkdirTemp, t.TempDir) or state-persistence \
operations (state.Write, storage reads) when the next line reports success \
to the caller. Propagate the error, explicitly handle it with a non-silent \
fallback, or explicitly document why it is safe to ignore. When a handler \
action writes a state file owned by another tool: (1) errors from the \
write must surface in the handler's output field, not be dropped; (2) a \
not-found condition (the side-effect state file does not exist) must be \
distinguished from actual read/write errors in both the error type and \
the caller's output so the caller can choose recovery; (3) the cross-tool \
side effect and its error contract must be documented in the tool's \
description at registration time."""

[execute.guardrails.skill-prose-source-verification]
severity = "warning"
description = "Before marking a task done that modifies a SKILL.md file, independently verify that all prose claims about tool behavior, dispatch scaffolds/resources, and schema validation are accurate by direct source-reading against the Go implementation and, where the prose describes a CI payload script, against that script (for example internal/tools/payloads/*.cjs). When prose asserts that a dispatch references a resource or scaffold, grep the tool's handler to confirm it exists; when prose claims conditional behavior (e.g. \"write is best-effort\"), verify the condition in the actual handler code; when prose lists or references enum values, verify each is in the actual schema; when a behavior or routing is described in multiple skill sections, confirm consistency across all sections and against current source. The same checks apply to state-format.md, config-format.md and docs/skills/*.md. Also check these claim kinds against source: (a) when prose enumerates a struct's fields, confirm every exported field of the Go struct appears in the prose; (b) when prose states a count or tier number, count the Go values and confirm the number matches; (c) when prose makes an exclusivity claim (only, sole) or an unconditional claim (always, every path), read the full field-access set or all code paths; (d) when prose claims absence, grep to confirm it; (e) when a doc describes a persisted row written by several code paths, enumerate every writer and state per-writer field differences; (f) for a precedence claim between two keys or flags, confirm the prose states the rule the validator enforces, and document a pair the code rejects as rejected; (g) confirm each example block follows the rules the doc states; (h) confirm each named git ref is the ref the code reads for that step. Do not rely on build/test success as evidence of prose accuracy."

[execute.guardrails.independent-completion-reverification]
severity = "error"
description = """
Never record task-done or wave-done from a self-report alone. A passing \
self-report is a claim, not evidence of correctness. Always independently \
confirm via `git diff --stat` scoped to expected files, then a full `git \
diff` read, then an independent re-run of the relevant build/vet/test \
commands -- run `go test ./...` (full suite), not just the plan's named \
per-package verify command, before marking any task done that changes a \
struct's field type or JSON tag. Do not trust pasted command output or \
worker/agent/coordinator self-reports of completion. Also: re-run \
integration-tagged tests named in Verification, not just unit tests; treat \
sub-agent/worker narration as a claim, not evidence -- re-derive \
completion from primary sources yourself; after a SKILL.md edit, re-run any \
line-keyed validator (e.g. skillcheck); before marking a binary-dependent \
task done, verify the binary's build timestamp is newer than the source \
change. Also cross-reference JSON-serialized struct diffs against the \
schema."""

[execute.guardrails.execute-handler-nil-normalization]
severity = "error"
description = """
MCP tool output is Markdown. The renderer prints a nil or empty slice, map, \
pointer, or string as `(none)`, so a handler does not need to turn nil into \
an empty collection before returning. Verify these at execute time, not just \
in the plan's stated contract: (1) a field the reader must see even when it \
is empty has no `omitempty` or `omitzero` tag, because the renderer drops a \
tagged field whose value is the zero value (rule 14 in \
docs/mcp-output-contract.md); (2) no code or test depends on the difference \
between nil and empty in tool output, because the reader cannot tell them \
apart; (3) no test expects JSON `null` in tool output. Values written to a \
persisted JSON state file are different: normalize nil there, because a \
`null` can break a later reader that type-asserts a slice."""

[execute.guardrails.spec-compliance-literal-contract-diff]
severity = "error"
description = """
Spec-compliance review of task completeness must perform literal \
contract-vs-diff comparison for any task with a Contract block, including \
Trivial tasks. Do not rely on plausibility checks or self-reported \
completion status. Before comparing diff-vs-contract, verify the \
contract's cited site/location actually exists at the stated path -- do \
not assume the plan's site citation is correct without checking."""

[execute.guardrails.constant-literal-migration-verified-complete]
severity = "error"
description = """
Before marking a task done that introduces a named constant to replace \
previously hardcoded string literals, execute a grep across the repo for the \
old literal and confirm zero remaining instances (outside intentional \
legacy-fallback paths). An incomplete rename creates two silently-diverging \
sources of truth and is worse than not renaming at all. This also applies \
to deleting an exported symbol (function, type, constant) entirely -- grep \
the whole repo, not just the package being changed, since callers in \
unrelated packages are easy to miss. Extends equally to config-key or \
namespace renames (e.g. moving a config field to a new section, renaming a \
key prefix like `execute.*` to `executePrefs.*`): grep the entire repository \
including all documentation files (docs/**, plugins/sdlc/skills/**/*.md) and \
configuration templates for the old name, confirming zero remaining \
instances or explicit legacy-fallback justification."""

[execute.guardrails.refactor-consolidation-test-validation]
severity = "error"
description = """
When a refactor consolidates duplicate logic (e.g. merging two near-identical \
functions or code paths), verify that every test which depended on the \
pre-consolidation behavior (e.g. an unconditional write that the merged path \
now makes conditional) still passes against the consolidated code -- do not \
assume behavioral equivalence from the refactor's intent alone. Run the full \
affected test suite, not just tests for the new shared path."""

[execute.guardrails.task-id-format-consistency]
severity = "warning"
description = """
Task IDs passed to execute_state calls (taskId, dependsOn references) must \
match the exact ID format declared in the plan/tasksJson -- do not silently \
normalize between a bare numeral and a prefixed form (e.g. "1" vs \
"task-1"). A format mismatch can silently fail an ID lookup instead of \
erroring."""

[execute.guardrails.shell-command-error-handling]
severity = "error"
description = """
Shell commands executed by tooling/scripts must check and propagate exit \
codes (e.g. an execOrThrow-equivalent, not a bare exec that swallows \
non-zero status) -- a silently-ignored non-zero exit produces a false \
success signal to the caller. The same holds for a false negative: when an \
error-swallowing helper returns null or empty, that value must not flow into \
a condition where it reads as a real negative answer (e.g. "not a \
release-bump commit"). Use the throwing helper when the command is expected \
to succeed."""

[execute.guardrails.sibling-payload-fix-parity]
severity = "error"
description = """
Before marking done a task that modifies the copy-pasted CI payloads \
(internal/tools/payloads/release-on-main.cjs, promote-release.cjs), \
check the git diff: every cross-cutting fix, classifier, \
hint or error branch must reach every sibling that shares the same push \
helper or token chain, not just one or two. Also confirm each \
.github/scripts/*.cjs mirror is byte-identical to its \
internal/tools/payloads/ source. The same parity rule covers the sibling \
workflow files (release workflows in .github/workflows/): concurrency group, \
cancel-in-progress, permissions, and trigger filters are cross-cutting \
settings; a change in one release workflow that pushes or tags a shared ref \
must reach every sibling with the same push target, or the task must \
explicitly document why they differ."""

[execute.guardrails.test-body-execution-verified]
severity = "error"
description = """
A test that passes without exercising the target code (e.g. an empty body, \
a body that never calls the function under test, or a mocked-away real \
boundary) does not count as coverage. Before marking a test task done, \
verify the test body actually invokes the code path it claims to cover and \
would fail if that code were broken. Partial coverage where a test calls the \
function for only one leg of a bool/enum parameter is insufficient; verify \
each combination named by the function's branch structure is actually \
exercised and its output asserted. A test in the same diff whose specific \
assertion was removed or weakened (e.g. a content check replaced by a bare \
non-empty check) without an intended change to the code under test is a \
masked regression: restore the assertion or justify the behavior change. \
For each new function with branch logic, including internal helpers, \
enumerate every if/switch arm and confirm a test exercises it and asserts \
the output. Equality-gated loops need a boundary test case."""

[execute.guardrails.preflight-covers-actual-operations]
severity = "error"
description = """
A read-only preflight check (e.g. checking repo/PR visibility) does not \
guarantee a subsequent write operation (e.g. `gh pr create`) will succeed -- \
permission requirements can differ (e.g. "must be a collaborator" applies \
to creating a PR but not to reading one). Do not treat a passing preflight \
as proof the real operation will succeed; verify the preflight checks the \
same permission class as the operation it precedes."""

[execute.guardrails.mcp-tool-annotation-reason-call-graph-verified]
severity = "warning"
description = """
Before marking done a task that adds or changes an MCP tool annotation \
(e.g. read-only, idempotent) with a reason string explaining why it is \
safe, verify the reason against an actual call-graph/reference search of \
the handler -- a plausible-sounding reason string is not evidence the \
annotation is correct."""

[execute.guardrails.nested-dispatch-cleanup-declared]
severity = "error"
description = """
When a skill runs as a nested dispatch inside another skill (e.g. /ship invoking execute or review) and dispatches background workers or sub-agents, verify these points in the skill text and dispatch code. (1) Each worker has a stop path in the stall handler (Step 3 or equivalent) and in every error-recovery path. (2) The normal-completion cleanup step (Step 9 or equivalent) re-checks every worker, ends any worker still running, and retries a stop that an earlier step failed. (3) When a stop still fails, a named fallback exists and is reachable with the dispatch as written: each dispatch passes the name or ID the fallback needs, such as the name parameter SendMessage requires. The failed worker is listed in the output and still counts toward any wave cap. (4) The results step names each worker that never reported in and each worker that cleanup could not end. (5) Every entry point and workflow variant that dispatches the same workers carries the nested-dispatch TaskStop note and the same stall, missing-worker, and cleanup rules. (6) Each Agent dispatch records the task ID it returns; a dispatch with no task ID is listed as a worker that cleanup cannot end. (7) A step that receives a report listing missing, unterminated, or unstopped workers reads that list and acts on each entry (stop it, retry through the named fallback, or disclose it), and the task names the report field the step reads. No worker should be abandoned."""

[execute.guardrails.nested-dispatch-runtime-stop]
severity = "warning"
description = """
When a skill runs as a nested dispatch inside another skill (e.g. /ship invoking execute or review), TaskStop may return a hard authorization error instead of the normal stall-handling flow. Before marking a task done or a wave complete in a nested run, verify that the stall-handling path ran and did not fail silently on that rejection. A diff cannot show this behavior. Verify it by a test or a manual run, and record the result in task verification."""

[execute.guardrails.enum-field-consistency-verified]
severity = "warning"
description = """
When a narration/message template references a set of enum-like phase or \
state values, the values used must match the canonical enum definition \
exactly (e.g. the phases list used by heartbeat/liveness messaging) -- do \
not hand-write a free-text placeholder list that can drift from the real \
enum."""

[execute.guardrails.go-doc-comment-compliance]
severity = "warning"
description = """
Before marking a task done that introduces or modifies package-scope Go \
identifiers (var, const, func, type, exported or not), verify each is \
immediately preceded by a `//` doc comment (not a `//go:embed` directive \
or other Go directive alone) following Go's documentation conventions. \
Verify that the doc comment's claims match the code body: a comment \
describing four cases when only two execute, or promising behavior that \
the code does not implement, is a finding. Additionally, verify that any \
comment block preceding a `package` declaration is separated by a blank \
line to prevent the comment from being misattached as the package doc \
string. Comments must not carry planning-artifact references (step \
numbers like '// Step 10.', plan section names like 'Final Shape', or \
task IDs) -- these are authoring leftovers that must be removed before \
shipping. Use `grep -n \
'^\\(var\\|const\\|func\\|type\\) ' <changed_file>` and confirm each \
match has a `//` comment line immediately above."""

[execute.guardrails."schema-enum-code-sync-verified"]
severity = "error"
description = """\
Before marking a task done that modifies plugins/sdlc/schemas/sdlc-config.schema.json, \
grep internal/config/config.go for the field names and enum values in the modified \
schema sections. Verify every enum value in the schema is recognized by the Go code \
(typically a const iota or switch branch). Missing an enum value from the Go side \
means the schema accepts values the code rejects, breaking configuration."""

[execute.guardrails.config-schema-template-sync-verified]
severity = "error"
description = """\
Before marking a task done that modifies internal/config/** or \
plugins/sdlc/schemas/sdlc-config.schema.json or plugins/sdlc/templates/*.toml, \
independently verify that all three stay synchronized: grep template comments \
and field names against schema enums and keys, and validate the template TOML \
against the JSON schema. A passing TestConfigTemplateRoundTrip indicates parser \
acceptance only, not schema parity -- both must be verified. Do not defer \
template sync as a 'documentation-only gap'. Also grep \
internal/tools/payloads/*.cjs for hardcoded config values (secret names, \
method values, permission claims) and confirm each is read from config at \
runtime or matches what scaffold_ci writes; confirm the .github/scripts/ \
mirrors stay byte-identical. Confirm schema description prose (permission \
scope, defaults) matches what the code needs, and each prose default is a \
structured default keyword. A doc comment stating a template default, \
anywhere in repo, must match the real value; a passing test is not proof."""

[execute.guardrails.mcp-error-suggestion-coverage]
severity = "error"
description = """
Before marking a task done that modifies error-returning handlers in \
internal/tools/ or internal/mcpserver/, audit all DomainError/InfraError/ \
DataError instantiations. Run: `grep -n 'DomainError{\\|InfraError{\\| \
DataError{' internal/tools/MODIFIED.go internal/mcpserver/MODIFIED.go \
2>/dev/null` and verify every match sets a Suggestion field to a non-empty \
string expression (a literal, a fmt.Sprintf, or a concatenation). Do not \
leave the field empty and rely on the default: when Suggestion is empty the \
renderer fills `## Do this` with generic text for the error class, which \
does not tell the caller how to recover from this specific error. Suggestion \
must encode a recovery instruction for the caller, not a generic message. Scope the grep to the entire modified \
handler function, including branches not touched by this task's diff -- a \
gap can pre-exist in code adjacent to the change. Document the grep result \
and verified instances in task verification section before marking done. Also check every return statement in the modified handler function, including success branches. Each untyped error return (errors.New, fmt.Errorf) must be wrapped in a DomainError, InfraError or DataError with a non-empty Suggestion. Each no-op success return (for example 'nothing to promote') must set the Next field to an outcome-specific instruction. Record each return path checked in the task verification section."""

[execute.guardrails.gh-error-enrichment-parity]
severity = "error"
description = """
Before marking a task done that modifies an MCP handler with two or more \
`gh` invocation call sites, grep the handler for each `gh` call and verify \
that every failure path calls the same permission-error enrichment helper. \
If the tool's description promises uniform enrichment for a class of `gh` \
failures (e.g., "account-switch guidance for any gh permission error"), \
then every `gh` call site that can fail with that error class must call the \
same helper. Do not allow one call site to enrich while another does not. \
When adding a new `gh` call site, trace how existing call sites handle \
permission errors and use the same enrichment routine. Document each call \
site and the enrichment routing in the task verification before marking \
done."""

[execute.guardrails.skill-flow-soundness]
severity = "error"
description = "Before marking done a task that modifies a SKILL.md, independently walk the skill's step flow end-to-end from the current file, not from the plan's narration, which may predate the edit. Verify: every step is reachable under some valid input; every terminal state (success, cancel, error, stall, interrupt) has an explicit next instruction, and its own row when the skill has a routes table; no two gating conditions across steps contradict each other; every Arguments-table flag is referenced in Workflow and vice versa; step-number cross-references (in this file and in companion sub-flows it dispatches) match the post-edit numbering. If the skill dispatches background workers, every exit path (success, stall, error, interrupt, cancel) must end each started worker via TaskStop or equivalent, or document why the worker ends itself, and must record its outcome in the run state (for example ledger_skip), whether or not the skill runs nested. Each loop or sub-flow must name exactly one return step. Also check these points: (a) routing bullets keyed on the same input are mutually exclusive: walk the boundary states (last round, CRITICAL gate result, single-item batch) against every bullet; exactly one must match; a state that matches no bullet is a dead end; (b) each route that writes the same persisted record derives each field from the same named source, or the prose names the route that wins on conflict; one call described in two places carries the same arguments in both; (c) a count that routes the flow includes every source, such as findings with no id; a route does not advance on a flag the fixer set about its own work without an independent re-check; (d) every explicit jump (go to, next, skip to, proceed to) reaches its target whenever that target's enabling condition holds; a route that jumps past an enabled step fails the task; each value a tool can return in its next string has a target step; (e) an offer that hands off to another skill or tool restates that target's precondition and is skipped when the precondition fails; (f) each Steps overview or header entry matches its body step's current number, name, action and tool call, and entries follow run order."

[execute.guardrails.mcp-handler-error-propagation]
severity = "error"
description = "Before marking a task done that modifies MCP tool handlers in internal/tools/, audit all code paths where operations can fail (config reads, type assertions, json.Unmarshal, external calls, file operations). Verify errors are propagated as structured responses (DomainError/InfraError/DataError with Suggestion), not silently dropped or treated as absent/default. Use grep to find config.Read, json.Unmarshal, type assertions, and similar fallible operations in modified handlers; for each, verify the error is either propagated to the caller or the handler explicitly documents why silencing it is safe. Flag any code that treats errors as 'not configured' or zero-values instead of surfacing them with actionable recovery guidance. Verify that each DomainError, InfraError, or DataError that wraps a lower-level error sets its Cause field to that original error, so the error chain is kept."

[execute.guardrails.multi-step-persistence-failure-coverage]
severity = "error"
description = 'When a task modifies a handler or helper function that performs multiple sequential persistent writes (file, state, config, git checkout or branch switch), verify each "step k fails after steps 1 through k-1 succeeded" scenario has an explicit test case exercising it. Example: evidenceRecord writes the writer JSON file and then brief.md; if the JSON write succeeds but the brief.md write fails, the next call sees the writer record but not the brief. For each handler or helper with N>=2 sequential writes, add one test per write failure point and assert the observable state afterward (what persisted, what did not, what the caller sees). A git checkout or branch switch counts as a write. When a later step fails, the test must assert the branch the tree is left on, and the error Suggestion must name that branch or the restore step. Do not assume single-write tests cover multi-step partial-failure behavior.'

[execute.guardrails.skill-step-behavior-doc-coverage]
severity = "error"
description = """
Before marking a task done that modifies a SKILL.md step's behavior \
(fail-fast condition, skip condition, blocking gate), step order, or phase \
placement, grep the corresponding `docs/skills/<skill>.md` file for every \
step whose behavior is changed and confirm that behavior is documented for \
each step. For a step reorder or phase relocation, also check every table \
and walkthrough in `docs/*-architecture.md` that lists that skill's steps, \
and confirm the moved step appears at its new position with its current \
tool calls. When the same behavior \
change applies to sibling steps (e.g. both verify-openspec and \
archive-openspec gaining fail-fast-on-missing), both steps must be \
documented; a doc update covering only the first sibling is a verification \
gap."""

[execute.guardrails.validator-duplication-check]
severity = "warning"
description = """
Before marking a task done that modifies a validator function in \
internal/tools/validators.go, audit the function body for duplicate \
input-validation checks (e.g. two separate "file is required" blocks for \
the same action). Each distinct validation condition must appear exactly \
once; consolidate duplicates into a single early-return check or extract \
a named helper. Grep the modified function's input-check patterns (e.g. \
`in.File == ""`, `in.Action == ""`) and verify each pattern has only one \
match within that function. Duplicate checks hide the real validation \
logic and diverge when one copy is updated but not the other."""

[execute.guardrails.config-section-setup-discoverability-verified]
description = "Before marking a task done that adds a new section ID to LocalSections (internal/config/config.go), grep internal/setupmeta/sections.go for that section ID. If it is absent, confirm that the section's user-facing documentation (docs/, a SKILL.md, or the config template comment) states that the section is hand-edited only and excluded from /setup. If the section is neither registered in setupmeta.Sections() nor documented as excluded, the task is incomplete. Some sections (e.g. executePrefs, workspace) are deliberately absent from setupmeta.Sections(), so absence alone is not a defect; an undocumented omission is."
severity = 'error'

[plan.guardrails.skill-behavior-claims-cite-skill-md]
description = "A plan claim about what another skill's step does (for example, which execute step runs the test suite, or which step writes state) must cite that skill's SKILL.md step text. A skill reference doc is not enough, because a reference doc can be stale."
severity = 'error'

[plan.guardrails.dependency-order]
description = 'Every dependsOn entry must name a task listed earlier in the plan. If a task needs a later task, reorder the tasks so the dependency is listed first before the plan is finalized.'
severity = 'error'

[plan.guardrails.acceptance-criteria-count-limit]
description = 'Each task lists at most 7 acceptance criteria. When a task needs more, split it into smaller tasks, each with one deliverable and at most 7 criteria.'
severity = 'error'

[plan.guardrails.config-combination-rule-stated]
description = "When a plan adds or changes two or more config keys or flags that a user can set together, the plan must state the combined-input rule for each pair: which input wins, or that the tool rejects the pair. The plan must name the validator branch that enforces that rule. Every doc example or prose claim about the pair in config-format.md, SKILL.md, or docs/ must follow the stated rule. A plan that leaves a pair's combined-input rule implicit is a plan defect."
severity = 'error'

[execute.guardrails.template-comment-states-constraints]
description = "Before marking a task done that adds or changes a key in plugins/sdlc/templates/*.toml, check that the comment for that key states every constraint the schema enforces on it: each allowed enum value, minItems, minimum and maximum bound, and each empty or invalid input the code rejects (for example, an empty awaitRemoteReviewers list). A comment that gives only the default, or that says 'see schema', is incomplete. Read each changed key's comment against its schema entry before marking the task done."
severity = 'warning'

[plan.guardrails.handler-input-semantic-invariants]
description = "Plans that add or change a handler input that is a list, array, or map must state the omitted-field behavior and the semantic invariants of that input, both in the plan and in the field's jsonschema_description. Name whether an empty value is rejected, whether IDs must be unique, and whether the list must cover every item of the set it references. Each invariant must map to a rejection path that returns a DomainError with a Suggestion and names the broken rule. Type and required-field checks do not cover these invariants. A plan that leaves them implicit is a plan defect."
severity = 'error'

[execute.guardrails.mcp-suggestion-names-working-recovery]
description = 'Before marking a task done that adds or changes a DomainError, InfraError, or DataError Suggestion in internal/tools/ or internal/mcpserver/, read the tool or action that the Suggestion names. Check that it accepts the input that failed and that its result can change the failing condition. A Suggestion that sends the caller to a tool or action that cannot fix this error fails the task. Record the named tool and this check in task verification.'
severity = 'error'

[execute.guardrails.mcp-side-effect-real-boundary-test]
description = 'Before marking a task done that adds or changes an MCP handler action with a filesystem or git side effect, add a test that calls the real handler entry point. Use real state files under t.TempDir, and real git in a temporary repository for git checks. Assert the persisted state and the returned output. Tag the test with the integration build tag (-tags integration), which the CI workflow runs. A test that calls only an internal helper, or fakes the state store, does not cover the side effect. Record the test name in task verification.'
severity = 'error'

[execute.guardrails.mcp-write-action-echoes-record]
description = 'Before marking a task done that adds or changes an MCP handler action that writes a record (record, append, set, skip, or similar), check each success return of that action. The output must echo the values it wrote, such as IDs, the reason, run and worker IDs, and any prior value it replaced. An output that holds only ok and next fails the task. Record the checked return paths in task verification.'
severity = 'error'

[plan.guardrails.persisted-io-failure-fallback]
description = 'Plans that add a read or write of a persisted file or state must name, for each read and each write, its failure fallback: propagate the error, or use a stated non-silent default. Each read of content that can grow must name a size bound and the behavior when the bound is exceeded. Name the error class for each failure: DomainError for bad caller input, InfraError for filesystem, network, or process failures, and DataError for parse or schema failures. A write that replaces a user-owned file must write a temp file and rename it, or the plan must state why an in-place write is safe. A plan that leaves any one of these implicit is a plan defect.'
severity = 'error'

[plan.guardrails.handler-state-change-safety]
description = "Plans that add a handler step which changes git branch or working-tree state must place that change after every step that can fail, or name the restore step for each later failure. Plans that add a no-op or already-done shortcut must state the filesystem or git check that confirms the shortcut's premise, not a marker read from a header or input. A plan that stages or commits must name the exact paths it stages; git add -A, git add ., git add -u and git commit -a are not allowed."
severity = 'error'

[execute.guardrails.explicit-git-staging-paths]
description = "Before marking a task done that adds or changes a git staging or commit call in Go code or a SKILL.md step, verify the call names only the exact paths the task changes. Never use git add -A, git add ., git add -u, or git commit -a. Each of these can stage files outside the task scope, and git add -A and git add . also stage untracked files. Confirm the staged set with git diff --cached --name-only against the task's Files list before the commit. Record the staging call and the staged paths in task verification."
severity = 'error'

[execute.guardrails.reuse-existing-go-helpers]
description = 'Before marking a task done that adds a Go function, grep the package and the module for an existing function with the same behavior, even under another name, and call that function instead. Two functions with the same body are a defect, for example shortSHA and shipShortSHA. Before hand-writing logic in a handler, grep for a shared core helper that already does the work, for example shipCompleteStepCore for step completion, and call it. Record each grep and the helper reused in task verification.'
severity = 'warning'

[plan.guardrails.exit-path-state-record]
description = 'Plans that add or change a SKILL.md exit path (success, cancel, error, interrupt, stall) must name, for each exit path, the state write made for each dispatched worker and for the run, such as a ledger_skip reason. The plan must list each exit path as a row in the routes table with its next step. An exit path that stops workers without recording their outcome in the state the run reads is a plan defect.'
severity = 'error'
